services:
  postgres:
    image: postgres:17-alpine
    container_name: new-api-key-usage-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: new_api_key_usage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d new_api_key_usage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
